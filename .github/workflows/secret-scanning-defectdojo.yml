name: "Secret Scanning → DefectDojo"

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  secret-scanning:
    runs-on: ubuntu-latest

    steps:
      - name: Get Secret Scanning alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
        run: |
          curl --fail \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/secret-scanning/alerts?state=open&per_page=100" \
            -o secret-scanning.json

      - name: Convert to DefectDojo format
        run: |
          python - <<'PY'
          import json

          with open("secret-scanning.json") as f:
              alerts = json.load(f)

          findings = []

          for alert in alerts:
              secret_type = alert.get("secret_type_display_name") \
                  or alert.get("secret_type") \
                  or "Secret detected"

              locations = alert.get("locations_url", "")

              findings.append({
                  "title": secret_type,
                  "severity": "High",
                  "description": (
                      f"GitHub Secret Scanning detected a secret of type: "
                      f"{secret_type}."
                  ),
                  "mitigation": (
                      "Revoke or rotate the exposed secret and remove it "
                      "from the repository history."
                  ),
                  "file_path": "",
                  "url": locations,
                  "unique_id_from_tool": str(alert.get("number"))
              })

          report = {
              "name": "GitHub Secret Scanning",
              "type": "Secret Scanning",
              "findings": findings
          }

          with open("secret-scanning-defectdojo.json", "w") as f:
              json.dump(report, f, indent=2)
          PY

      - name: Upload to DefectDojo
        run: |
          curl --fail -X POST \
            "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_TOKEN }}" \
            -F "scan_type=Generic Findings Import" \
            -F "file=@secret-scanning-defectdojo.json" \
            -F "product_name=JuiceSHop" \
            -F "engagement_name=GitHub Actions" \
            -F "auto_create_context=true"
